# Rclean 问卷质控规则表（YAML 模板）
# 用法：复制本文件，按你的问卷字段修改；run_qc(data, rules_path=本文件)
# 以 # 开头的行为注释，不参与检查

dataset: 示例问卷                    # 数据集名称（仅用于报告显示）

# ① 重复个案：判定重复的关键列（如编号/身份证后几位）
#    留空 key 或整段删除 = 按整行完全一致判定重复
dupes:
  key: [ID]

# ④ 缺失值：这些列不允许缺失（关键标识列）
missing:
  key: [ID]

# ⑤ 连续变量离群值
#   method: iqr    → 界值 = Q1 - k*IQR, Q3 + k*IQR（k 常用 1.5；3 为极端离群）
#   method: zscore → 界值 = 均值 ± k 个标准差（k 常用 3）
#   columns 留空 = 自动检查全部数值列
outliers:
  method: iqr
  k: 1.5
  columns: [AGE, MAXTEMP]

# ②③ 逐条规则：非法值 + 跨变量逻辑关系
rules:
  - id: SEX_legal            # 规则编号（唯一，会出现在异常明细里）
    check: in_set            # 取值必须在 values 内（对应 EpiData LEGAL）
    column: SEX
    values: [1, 2]           # 1=男 2=女
    severity: error

  - id: AGE_range            # 数值范围（对应 EpiData RANGE）
    check: between
    column: AGE
    min: 0
    max: 120
    severity: error

  - id: MAXTEMP_range        # 体温范围（℃）
    check: between
    column: MAXTEMP
    min: 35
    max: 42
    severity: error

  - id: ID_not_null          # 编号不允许缺失
    check: not_null
    column: ID
    severity: error

  - id: PHONE_regex        # 正则匹配示例（11 位手机号）
    check: regex
    column: PHONE
    values: ["^1[3-9][0-9]{9}$"]
    severity: warning

  # 跨变量逻辑表达式示例（发病日期不早于出生日期）：
  # - id: date_logic
  #   check: expr
  #   expr: "ONSETDT >= BIRTHDT | is.na(ONSETDT) | is.na(BIRTHDT)"
